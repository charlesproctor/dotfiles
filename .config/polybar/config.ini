[bar/mybar]
monitor = ${env:MONITOR:}
width = 100%
height = 24
background = #000000
foreground = #ffffff
font-0 = "Terminus:size=10"
modules-left = workspaces
modules-center = date
modules-right = battery

; -----------------------------
; Date/Time
; -----------------------------
[module/date]
type = internal/date
interval = 5
date = %a %b %d
time = %I:%M %p
label = %date%  %time%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 5
label-charging = + %percentage%%
label-discharging = - %percentage%%
label-full = %percentage%%

[module/workspaces]
type = internal/i3
index-sort = true
pin-workspaces = true
wrapping-scroll = false

label-focused = %index%
label-focused-background = #ffffff
label-focused-foreground = #000000
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-foreground = #888888
label-unfocused-padding = 1

label-visible = %index%
label-visible-foreground = #aaaaaa
label-visible-padding = 1

label-urgent = %index%
label-urgent-background = #ff0000
label-urgent-foreground = #ffffff
label-urgent-padding = 1
